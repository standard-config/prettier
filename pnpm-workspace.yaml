autoDedupe: true

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^26.6.6
  oxc-parser: ~0.160.0
  prettier: ^3.10.1
  prettier-plugin-sort-json: ^4.2.0
  sh-syntax: ^0.8.7
  typescript: ^6.0.3
  vite-plus: ^1.7.0

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - prettier
  - prettier-plugin-expand-json
  - prettier-plugin-markdown-html
  - prettier-plugin-yaml

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>tsrs: latest

packages:
  - packages/*

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - tsrs
