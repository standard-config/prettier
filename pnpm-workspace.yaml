autoDedupe: true

autoInstallPeers: false

catalog:
  '@prettier/plugin-oxc': ^0.2.4
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^26.6.6
  prettier: ^3.10.1
  prettier-plugin-sh: ^0.20.2
  prettier-plugin-sort-json: ^4.2.0
  typescript: ^6.0.3
  vite-plus: ^1.7.0

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@prettier/*'
  - '@standard-config/*'
  - prettier
  - prettier-plugin-expand-json
  - prettier-plugin-markdown-html
  - prettier-plugin-yaml

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest

packages:
  - packages/*

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - tsrs
